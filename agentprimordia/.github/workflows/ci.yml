name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Go Test (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.23', '1.24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test with race detector
        if: runner.os != 'Windows'
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Test without race detector (Windows)
        if: runner.os == 'Windows'
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: "Check coverage (Phase 7.2: tiered gate, 8.1: Tier 3 soft gate)"
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.23'
        run: |
          # Total coverage (reference metric)
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"

          # Tiered gate checks
          fail=0
          warn=0
          for tier in "internal/agent:80" "internal/llm:65" "pkg:65"; do
            path=${tier%:*}
            threshold=${tier#*:}
            cov=$(go test -cover ./$path 2>&1 | grep -oE '[0-9.]+%' | head -1 | tr -d '%')
            if [ -z "$cov" ]; then
              echo "  $path: SKIP (no test)"
              continue
            fi
            echo "  $path: ${cov}% (tier 1/2, threshold ${threshold}%)"
            if (( $(echo "$cov < $threshold" | bc -l) )); then
              echo "::error::$path coverage ${cov}% < ${threshold}%"
              fail=1
            fi
          done

          # Tier 3 soft gate: core packages >= 50% (warn only, not fail)
          for pkg in internal/memory internal/tools internal/orchestration internal/persist; do
            cov=$(go test -cover ./$pkg 2>&1 | grep -oE '[0-9.]+%' | head -1 | tr -d '%')
            if [ -z "$cov" ]; then continue; fi
            echo "  $pkg: ${cov}% (tier 3 soft, target 50%)"
            if (( $(echo "$cov < 50" | bc -l) )); then
              echo "::warning::$pkg coverage ${cov}% < 50% (tier 3 soft gate)"
              warn=1
            fi
          done

          if [ $fail -eq 1 ]; then
            echo "::error::Tier 1/2 coverage gate failed."
            exit 1
          fi
          if [ $warn -eq 1 ]; then
            echo "::warning::Tier 3 soft gate has warnings (non-blocking)."
          fi
          echo "OK: tiered coverage gates passed"

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.23'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

      - name: Check Deprecated annotations (Phase 8.4)
        if: matrix.os == 'ubuntu-latest'
        run: |
          deprecated_count=$(grep -r "Deprecated:" --include="*.go" . | wc -l)
          removed_in_count=$(grep -r "Removed in v" --include="*.go" . | wc -l)
          echo "Deprecated: ${deprecated_count}, Removed in: ${removed_in_count}"
          if [ "$deprecated_count" -gt 0 ] && [ "$removed_in_count" -lt "$deprecated_count" ]; then
            echo "::error::每个 // Deprecated: 必须配 // Removed in vX.Y. 标注"
            echo "::error::当前: $deprecated_count Deprecated, 仅 $removed_in_count Removed in"
            exit 1
          fi
          echo "OK: Deprecated 标注完整"

      - name: Check CHANGELOG [Unreleased] (Phase 8.4)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! grep -q "^## \[Unreleased\]" docs/CHANGELOG.md; then
            echo "::warning::CHANGELOG.md 缺 [Unreleased] 节"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Run npm audit
        working-directory: sdk/typescript
        run: npm audit --audit-level=high || true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  api-diff:
    name: API Compatibility Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Check Go API compatibility
        run: |
          go install golang.org/x/exp/cmd/apidiff@latest
          # Compare public API against base branch
          BASE_REF=${{ github.base_ref }}
          git checkout "origin/$BASE_REF" -- pkg/
          apidiff -w /tmp/base.api ./pkg/...
          git checkout HEAD -- pkg/
          apidiff -incompatible /tmp/base.api ./pkg/... || {
            echo "::error::Incompatible API changes detected. Review before merging."
            exit 1
          }

  ts-test:
    name: TypeScript SDK Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Type check
        working-directory: sdk/typescript
        run: npx tsc --noEmit

      - name: Build
        working-directory: sdk/typescript
        run: npm run build

      - name: Test with coverage
        working-directory: sdk/typescript
        run: npm test -- --coverage

      - name: Upload TS coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ts-coverage
          path: sdk/typescript/coverage

  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build ap CLI
        run: go build -ldflags="-X main.Version=${{ github.ref_name }}" -o ap ./cmd/ap/

      - name: Verify CLI
        run: ./ap version
