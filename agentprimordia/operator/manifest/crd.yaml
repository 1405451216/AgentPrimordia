apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentdeployments.agent.primordia.dev
spec:
  group: agent.primordia.dev
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["replicas", "template"]
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 1
                template:
                  type: object
                  required: ["provider", "model", "systemPrompt"]
                  properties:
                    provider:
                      type: string
                      enum: [openai, anthropic, gemini, ollama, azure]
                    model:
                      type: string
                      minLength: 1
                    systemPrompt:
                      type: string
                      minLength: 1
                    maxTurns:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 20
                    apiSecretRef:
                      type: string
                    tools:
                      type: array
                      items:
                        type: object
                        required: ["name"]
                        properties:
                          name:
                            type: string
                            enum: [filesystem, shell, web, knowledge]
                          config:
                            type: object
                            additionalProperties:
                              type: string
                    memory:
                      type: object
                      properties:
                        backend:
                          type: string
                          enum: [sqlite, memory]
                          default: sqlite
                        sizeLimit:
                          type: string
                        pvcName:
                          type: string
                    resources:
                      type: object
                      properties:
                        requests:
                          type: object
                          properties:
                            cpu:
                              type: string
                            memory:
                              type: string
                        limits:
                          type: object
                          properties:
                            cpu:
                              type: string
                            memory:
                              type: string
                    metrics:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        path:
                          type: string
                        port:
                          type: integer
                          format: int32
                        serviceMonitor:
                          type: object
                          properties:
                            name:
                              type: string
                            interval:
                              type: string
                    tracing:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        otlpEndpoint:
                          type: string
                        samplingRate:
                          type: number
                          format: double
                autoscaling:
                  type: object
                  required: ["minReplicas", "maxReplicas", "targetConcurrentTasks"]
                  properties:
                    minReplicas:
                      type: integer
                      minimum: 1
                    maxReplicas:
                      type: integer
                      minimum: 1
                    targetConcurrentTasks:
                      type: integer
                      minimum: 1
                healthCheck:
                  type: object
                  properties:
                    livenessProbe:
                      type: object
                      properties:
                        httpGet:
                          type: object
                          required: ["path", "port"]
                          properties:
                            path:
                              type: string
                            port:
                              type: integer
                        initialDelaySeconds:
                          type: integer
                        timeoutSeconds:
                          type: integer
                        periodSeconds:
                          type: integer
                        successThreshold:
                          type: integer
                        failureThreshold:
                          type: integer
                    readinessProbe:
                      type: object
                      properties:
                        httpGet:
                          type: object
                          required: ["path", "port"]
                          properties:
                            path:
                              type: string
                            port:
                              type: integer
                        initialDelaySeconds:
                          type: integer
                        timeoutSeconds:
                          type: integer
                        periodSeconds:
                          type: integer
                        successThreshold:
                          type: integer
                        failureThreshold:
                          type: integer
            status:
              type: object
              properties:
                activeReplicas:
                  type: integer
                completedTasks:
                  type: integer
                failedTasks:
                  type: integer
                errorRate:
                  type: number
                averageTurnLatencySeconds:
                  type: number
                totalTokens:
                  type: integer
                  format: int64
                estimatedCostUSD:
                  type: number
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Active
          type: integer
          jsonPath: .status.activeReplicas
        - name: Provider
          type: string
          jsonPath: .spec.template.provider
        - name: Model
          type: string
          jsonPath: .spec.template.model
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: agentdeployments
    singular: agentdeployment
    kind: AgentDeployment
    shortNames:
      - ad
      - agent
