site_name: AgentPrimordia Documentation
site_description: Go AI Agent 开发框架官方文档
site_url: https://docs.agentprimordia.dev
site_author: AgentPrimordia Team

repo_name: AgentPrimordia/agentprimordia
repo_url: https://github.com/AgentPrimordia/agentprimordia
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 AgentPrimordia Team

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy

plugins:
  - search:
      separator: '[\s\-\.]+'
      lang:
        - zh
        - en
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
  - tags

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AgentPrimordia/agentprimordia
    - icon: fontawesome/brands/discord
      link: https://discord.gg/agentprimordia
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/AgentPrimordia
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  alternate:
    - name: 中文
      link: /zh/
      lang: zh
    - name: English
      link: /en/
      lang: en

