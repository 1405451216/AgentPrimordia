# 自治 Agent 守护进程部署配置示例
# 用于长期运行的自治 Agent（v3.3 长期自治）
#
# 使用方式：
#   docker compose -f deploy/docker-compose.autonomy.yml up -d
#
# 关键配置：
#   - restart: always — 进程崩溃后自动重启（配合 checkpoint 恢复）
#   - healthcheck — 定期检查 Agent 心跳
#   - volumes — 持久化 checkpoint 数据

services:
  autonomous-agent:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["./ap", "autonomy", "run", "--daemon"]
    restart: always
    environment:
      - AP_AGENT_NAME=autonomous-monitor
      - AP_CHECKPOINT_PATH=/data/checkpoints
      - AP_LOG_LEVEL=info
      - AP_STALL_THRESHOLD=5
      - AP_MAX_REPLANS=3
    volumes:
      - agent-data:/data/checkpoints
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agent-data:
    driver: local
