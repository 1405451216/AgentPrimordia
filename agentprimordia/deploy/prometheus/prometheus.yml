# AgentPrimordia Prometheus 主配置示例
#
# 该文件演示如何将 AgentPrimordia 集成到 Prometheus 中：
#  1. scrape_configs: 从 /metrics 端点采集
#  2. rule_files: 加载告警规则
#  3. alerting: 配置 Alertmanager

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    monitor: "agentprimordia"

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "agentprimordia"
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "agentprimordia:8080"
        labels:
          service: agentprimordia
          env: production

  # Kubernetes 场景下使用服务发现
