apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentprimordia.fullname" . }}
  labels:
    {{- include "agentprimordia.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agentprimordia.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "agentprimordia.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agentprimordia.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agentprimordia
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
            {{- end }}
          env:
            - name: AP_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AP_LISTEN_ADDR
              value: ":{{ .Values.service.port }}"
            - name: AP_CLUSTER_ENABLED
              value: {{ .Values.cluster.enabled | quote }}
            {{- if .Values.cluster.enabled }}
            - name: AP_CLUSTER_DISCOVERY
              value: {{ .Values.cluster.discovery | quote }}
            - name: AP_ETCD_ENDPOINTS
              value: {{ include "agentprimordia.etcdEndpoints" . | quote }}
            {{- end }}
            - name: AP_METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            - name: AP_METRICS_PORT
              value: {{ .Values.service.metricsPort | quote }}
            - name: AP_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "agentprimordia.fullname" . }}-data
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
