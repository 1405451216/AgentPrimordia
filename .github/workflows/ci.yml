name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Go Test (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.26']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Download dependencies
        run: go mod download

      - name: Build
        env:
          CGO_ENABLED: 0
        run: go build ./...

      - name: Test with race detector
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: 1
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Test without race detector (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: 0
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: "Check coverage (Phase 7.2: tiered gate, 8.1: Tier 3 soft gate)"
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26'
        run: |
          # Total coverage (reference metric)
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"

          # Tiered gate checks
          fail=0
          warn=0
          for tier in "internal/agent:80" "internal/llm:65" "pkg:65"; do
            path=${tier%:*}
            threshold=${tier#*:}
            cov=$(go test -cover ./$path 2>&1 | grep -oE '[0-9.]+%' | head -1 | tr -d '%')
            if [ -z "$cov" ]; then
              echo "  $path: SKIP (no test)"
              continue
            fi
            echo "  $path: ${cov}% (tier 1/2, threshold ${threshold}%)"
            if (( $(echo "$cov < $threshold" | bc -l) )); then
              echo "::error::$path coverage ${cov}% < ${threshold}%"
              fail=1
            fi
          done

          # Tier 3 soft gate: core packages >= 50% (warn only, not fail)
          for pkg in internal/memory internal/tools internal/orchestration internal/persist; do
            cov=$(go test -cover ./$pkg 2>&1 | grep -oE '[0-9.]+%' | head -1 | tr -d '%')
            if [ -z "$cov" ]; then continue; fi
            echo "  $pkg: ${cov}% (tier 3 soft, target 50%)"
            if (( $(echo "$cov < 50" | bc -l) )); then
              echo "::warning::$pkg coverage ${cov}% < 50% (tier 3 soft gate)"
              warn=1
            fi
          done

          if [ $fail -eq 1 ]; then
            echo "::error::Tier 1/2 coverage gate failed."
            exit 1
          fi
          if [ $warn -eq 1 ]; then
            echo "::warning::Tier 3 soft gate has warnings (non-blocking)."
          fi
          echo "OK: tiered coverage gates passed"

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

      - name: Check Deprecated annotations (Phase 8.4)
        if: matrix.os == 'ubuntu-latest'
        run: |
          deprecated_count=$(grep -r "Deprecated:" --include="*.go" . | wc -l)
          removed_in_count=$(grep -r "Removed in v" --include="*.go" . | wc -l)
          echo "Deprecated: ${deprecated_count}, Removed in: ${removed_in_count}"
          if [ "$deprecated_count" -gt 0 ] && [ "$removed_in_count" -lt "$deprecated_count" ]; then
            echo "::error::每个 // Deprecated: 必须配 // Removed in vX.Y. 标注"
            echo "::error::当前: $deprecated_count Deprecated, 仅 $removed_in_count Removed in"
            exit 1
          fi
          echo "OK: Deprecated 标注完整"

      - name: Check CHANGELOG [Unreleased] (Phase 8.4)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! grep -q "^## \[Unreleased\]" docs/CHANGELOG.md; then
            echo "::warning::CHANGELOG.md 缺 [Unreleased] 节"
          fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Go license check
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./... 2>&1 || echo "::warning::许可证检查发现问题（非阻塞）"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install npm dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Run npm audit (strict)
        working-directory: sdk/typescript
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run Socket security scan
        working-directory: sdk/typescript
        env:
          SOCKET_API_KEY: ${{ secrets.SOCKET_API_KEY }}
        run: |
          if [ -n "$SOCKET_API_KEY" ]; then
            npx @socketsecurity/cli scan --strict || echo "::warning::Socket 扫描发现问题"
          else
            echo "::notice::Socket API key 未配置，跳过 Socket 扫描"
          fi
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: true
          # 拒绝已知漏洞的依赖
          deny-licenses: GPL-3.0, AGPL-3.0, LGPL-3.0

  api-diff:
    name: API Compatibility Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Check Go API compatibility
        run: |
          go install golang.org/x/exp/cmd/apidiff@latest
          # Compare public API against base branch
          BASE_REF=${{ github.base_ref }}
          git checkout "origin/$BASE_REF" -- pkg/
          apidiff -w /tmp/base.api ./pkg/...
          git checkout HEAD -- pkg/
          apidiff -incompatible /tmp/base.api ./pkg/... || {
            echo "::error::Incompatible API changes detected. Review before merging."
            exit 1
          }

  ts-test:
    name: TypeScript SDK Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Type check
        working-directory: sdk/typescript
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        working-directory: sdk/typescript
        run: npm run lint

      - name: Build
        working-directory: sdk/typescript
        run: npm run build

      - name: API Compatibility Check
        working-directory: sdk/typescript
        run: npx api-extractor run --local

      - name: Test with coverage
        working-directory: sdk/typescript
        run: npm test -- --coverage

      - name: Upload TS coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ts-coverage
          path: sdk/typescript/coverage

  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build ap CLI
        run: go build -ldflags="-X main.Version=${{ github.ref_name }}" -o ap ./cmd/ap/

      - name: Verify CLI
        run: ./ap version

  cross-compile:
    name: Cross-Compile Verify (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Cross-compile binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY=ap-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY=${BINARY}.exe
          fi
          go build -ldflags="-s -w -X main.Version=ci-${{ github.sha }}" -o ${BINARY} ./cmd/ap/

      - name: Verify binary exists
        run: |
          BINARY=ap-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY=${BINARY}.exe
          fi
          test -f ${BINARY} && echo "OK: ${BINARY} built successfully"
          ls -lh ${BINARY}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.26-${{ hashFiles('**/go.sum') }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.0
          working-directory: agentprimordia
          args: --timeout 5m

  operator-envtest:
    name: Operator EnvTest (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.26-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26-

      - name: Download dependencies
        run: go mod download

      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest

      - name: Fetch envtest binaries
        run: |
          ENVTEST_DIR=$(setup-envtest use -p path 1.31.x)
          echo "KUBEBUILDER_ASSETS=$ENVTEST_DIR" >> $GITHUB_ENV
          echo "Fetched envtest assets at: $ENVTEST_DIR"

      - name: Run envtest E2E tests
        env:
          CGO_ENABLED: 0
        run: go test -tags=envtest -v -timeout=120s ./operator/controller/...

  # ===== Phase 4: 跨语言同步验证 =====

  cross-language-check:
    name: Cross-Language API Compatibility
    runs-on: ubuntu-latest
    needs: [test, ts-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run cross-language API compatibility check
        run: node scripts/cross-language-api-check.mjs

      - name: Run dual-SDK version sync check
        run: node scripts/version-sync-check.mjs

  version-consistency:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run version consistency check
        run: bash scripts/version-check.sh

  perf-regression:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run benchmark subset
        working-directory: agentprimordia
        run: |
          go test -bench='BenchmarkConsistentHash_GetNode|BenchmarkDistributedState|BenchmarkAgentRun|BenchmarkMemoryStore|BenchmarkMemoryLatency' \
            -benchmem -benchtime=500ms -run='^$' -count=3 ./bench/suite/ | tee /tmp/bench-output.txt

      - name: Check for regressions against baseline
        run: bash scripts/bench-regression-check.sh /tmp/bench-output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: /tmp/bench-output.txt
          retention-days: 30
