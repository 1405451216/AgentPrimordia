name: Nightly

on:
  schedule:
    # 每天 UTC 02:00 运行
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  full-test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download dependencies
        run: go mod download

      - name: Run all tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Run benchmarks
        run: go test -bench=. -benchmem -run=^$ ./...

      - name: Coverage report
        run: |
          go tool cover -func=coverage.out | tail -1

  security-scan:
    name: Nightly Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -test ./... 2>&1 | tee govulncheck-report.txt

      - name: Upload govulncheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-report
          path: govulncheck-report.txt

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Run Trivy container scan (if Dockerfile exists)
        if: hashFiles('Dockerfile') != ''
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: 'agentprimordia:latest'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  dependency-freshness:
    name: Dependency Freshness Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Check for outdated dependencies
        run: |
          go install github.com/psampaz/go-mod-outdated@latest
          go list -u -m -json all 2>/dev/null | go-mod-outdated -update -direct || true

      - name: npm audit (TypeScript SDK)
        working-directory: sdk/typescript
        run: |
          npm ci
          npm audit --audit-level=high || echo "::warning::npm audit 发现问题"
          echo "## 覆盖率报告" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out >> $GITHUB_STEP_SUMMARY

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build . --tag agentprimordia:nightly

      - name: Verify image
        run: docker run --rm agentprimordia:nightly echo "Docker image OK"

  chaos-engineering:
    name: Chaos Engineering Nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download dependencies
        working-directory: agentprimordia
        run: go mod download

      - name: Run chaos engineering tests
        working-directory: agentprimordia
        run: |
          go test -v -race -count=1 -timeout=10m ./internal/chaos/... 2>&1 | tee chaos-report.txt

      - name: Run soak test (short mode)
        working-directory: agentprimordia
        run: |
          go test -v -race -count=1 -timeout=5m -run TestSoak ./internal/llm/soak/... 2>&1 | tee -a chaos-report.txt || true

      - name: Upload chaos report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-nightly-report
          path: agentprimordia/chaos-report.txt

      - name: Summary
        if: always()
        run: |
          echo "## 混沌工程 Nightly 报告" >> $GITHUB_STEP_SUMMARY
          echo "运行时间: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          if [ -f agentprimordia/chaos-report.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 agentprimordia/chaos-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # ===== 真实 LLM 集成测试（多 Provider 可用性验证） =====
  #
  # 运行 TestIntegration_* 套件（//go:build integration 门控）：
  #   - 在仓库 Secrets 中配置对应 API Key 的 Provider 会跑真实调用
  #   - 未配置的 Provider 测试优雅跳过（SKIP），不会导致失败
  # 用于持续验证多 Provider（OpenAI/Anthropic/Gemini/Qwen/DeepSeek/GLM）
  # 的真实可用性，防止模型/凭据变更被无声吞掉。
  llm-integration:
    name: Real LLM Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download dependencies
        run: go mod download

      - name: Run real LLM integration tests
        working-directory: agentprimordia
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: |
          go test -tags=integration -count=1 -timeout=15m \
            ./internal/llm/... ./internal/agent/... ./internal/guardrail/... ./internal/eval/... ./pkg/...

      - name: Summary
        if: always()
        run: |
          echo "## 真实 LLM 集成测试" >> $GITHUB_STEP_SUMMARY
          echo "运行时间: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "未配置 API Key 的 Provider 集成测试会跳过（SKIP）；" >> $GITHUB_STEP_SUMMARY
          echo "配置后跑真实调用，401/超时等凭据或服务问题会在此 job 暴露。" >> $GITHUB_STEP_SUMMARY

  # ===== 真实 LLM 跑分门禁（v3.5-2） =====
  #
  # 对 60 条真实 harness 基准集跑真实 LLM，产出 成功率/成本/耗时/恢复率 报告。
  # 版本门禁：通过率 ≥ max(基线, 阈值)，分数只升不降。
  # 基线文件: agentprimordia/bench/llm-bench/baseline.json（发版时以 --update-baseline 刷新）。
  # 未配置 OPENAI_API_KEY 时跳过（SKIP），不阻塞其余 nightly job。
  llm-benchmark:
    name: LLM Benchmark Gate (v3.5-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download dependencies
        working-directory: agentprimordia
        run: go mod download

      - name: Run real LLM benchmark (gate vs baseline)
        id: bench
        working-directory: agentprimordia
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::warning::OPENAI_API_KEY 未配置，跳过真实跑分门禁"
            exit 0
          fi
          set +e
          go run ./bench/llm-bench --provider openai --model gpt-4o-mini \
            --version nightly --threshold 0.8 --retries 1 \
            --out llm-bench-report.json 2>&1 | tee llm-bench-log.txt
          BENCH_EXIT=${PIPESTATUS[0]}
          set -e
          echo "bench_exit=$BENCH_EXIT" >> $GITHUB_OUTPUT
          exit $BENCH_EXIT

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-bench-report
          path: |
            agentprimordia/llm-bench-report.json
            agentprimordia/llm-bench-log.txt
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## 真实 LLM 跑分门禁" >> $GITHUB_STEP_SUMMARY
          if [ -f agentprimordia/llm-bench-report.json ]; then
            cat agentprimordia/llm-bench-report.json >> $GITHUB_STEP_SUMMARY
          else
            echo "未产生报告（无 API Key 或跳过）" >> $GITHUB_STEP_SUMMARY
          fi

  # ===== TS 真实 LLM 跑分（v3.7-2 双线可比基线） =====
  # 与 Go 端跑分同一套基准集，产出可比分数。
  ts-llm-benchmark:
    name: TS LLM Benchmark (v3.7-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Run TS real LLM benchmark
        id: tsbench
        working-directory: sdk/typescript
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::warning::OPENAI_API_KEY 未配置，跳过 TS 真实跑分"
            exit 0
          fi
          npx vitest run tests/integration/llm-bench.test.ts 2>&1 | tee ts-llm-bench-log.txt

      - name: Upload TS benchmark log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-llm-bench
          path: sdk/typescript/ts-llm-bench-log.txt
          if-no-files-found: ignore
