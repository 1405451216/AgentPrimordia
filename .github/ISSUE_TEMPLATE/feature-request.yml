name: 功能请求
description: 建议新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题
      description: 描述你遇到的问题或场景
      placeholder: "我需要 Agent 在执行长时间任务时能暂停和恢复..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望如何解决
      placeholder: "添加 Agent.Pause() 和 Agent.Resume() 方法..."
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      options:
        - agent
        - llm
        - tools
        - memory
        - pool
        - CLI
        - 其他
