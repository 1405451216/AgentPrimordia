<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="-apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f6feb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0969da;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ea043;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f883d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bf8700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a6700;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="reportGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8250df;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6639ba;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#57606a" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">GitHub Issue Triage Bot — 架构</text>
  <text x="400" y="52" text-anchor="middle" font-size="13" fill="#57606a">ReAct Agent + 3 自定义工具 + GitHub API 模拟器</text>

  <!-- Layer 1: IssueTriageAgent -->
  <rect x="50" y="80" width="700" height="100" rx="12" fill="url(#agentGrad)" opacity="0.95"/>
  <text x="400" y="108" text-anchor="middle" font-size="16" font-weight="600" fill="white">IssueTriageAgent (ReAct Loop)</text>
  <text x="400" y="132" text-anchor="middle" font-size="12" fill="#ddf4ff">推理 → 工具调用 → 观察 → 分类 → 报告</text>
  <text x="400" y="152" text-anchor="middle" font-size="11" fill="#ddf4ff" font-style="italic">5 个 Issue × 平均 3 轮对话 = 完整 triage 流程</text>
  <text x="400" y="170" text-anchor="middle" font-size="11" fill="#ddf4ff" font-style="italic">temperature=0, max_turns=20, 支持 OpenAI/Qwen/DeepSeek/Mock</text>

  <!-- Layer 2: 3 Tools -->
  <rect x="80" y="220" width="190" height="100" rx="10" fill="url(#toolGrad)" opacity="0.92"/>
  <text x="175" y="248" text-anchor="middle" font-size="15" font-weight="600" fill="white">list_issues</text>
  <text x="175" y="272" text-anchor="middle" font-size="11" fill="#dafbe1">GET /repos/.../issues</text>
  <text x="175" y="290" text-anchor="middle" font-size="11" fill="#dafbe1">state: open/closed/all</text>
  <text x="175" y="306" text-anchor="middle" font-size="10" fill="#dafbe1" font-style="italic">返回 JSON 数组</text>

  <rect x="305" y="220" width="190" height="100" rx="10" fill="url(#toolGrad)" opacity="0.92"/>
  <text x="400" y="248" text-anchor="middle" font-size="15" font-weight="600" fill="white">read_issue</text>
  <text x="400" y="272" text-anchor="middle" font-size="11" fill="#dafbe1">GET /repos/.../issues/{n}</text>
  <text x="400" y="290" text-anchor="middle" font-size="11" fill="#dafbe1">issue_number: int</text>
  <text x="400" y="306" text-anchor="middle" font-size="10" fill="#dafbe1" font-style="italic">返回 issue 详情</text>

  <rect x="530" y="220" width="190" height="100" rx="10" fill="url(#toolGrad)" opacity="0.92"/>
  <text x="625" y="248" text-anchor="middle" font-size="15" font-weight="600" fill="white">add_label</text>
  <text x="625" y="272" text-anchor="middle" font-size="11" fill="#dafbe1">POST /.../issues/{n}/labels</text>
  <text x="625" y="290" text-anchor="middle" font-size="11" fill="#dafbe1">labels: string[]</text>
  <text x="625" y="306" text-anchor="middle" font-size="10" fill="#dafbe1" font-style="italic">去重合并 label</text>

  <!-- Layer 3: Mock GitHub API -->
  <rect x="100" y="360" width="600" height="100" rx="10" fill="url(#apiGrad)" opacity="0.9"/>
  <text x="400" y="388" text-anchor="middle" font-size="15" font-weight="600" fill="white">GitHub API (httptest.Server + 内存仓库)</text>
  <text x="400" y="412" text-anchor="middle" font-size="12" fill="#fff8c5">3 endpoints: list / read / add_label</text>
  <text x="400" y="432" text-anchor="middle" font-size="11" fill="#fff8c5">5 seed issues (bug × 2 / feature / question / duplicate)</text>
  <text x="400" y="450" text-anchor="middle" font-size="10" fill="#fff8c5" font-style="italic">生产环境可替换为真实 GitHub API: apiBase = "https://api.github.com"</text>

  <!-- Layer 4: Report -->
  <rect x="250" y="490" width="300" height="20" rx="4" fill="url(#reportGrad)"/>
  <text x="400" y="504" text-anchor="middle" font-size="12" font-weight="600" fill="white">最终报告: Markdown 表格 (Issue / Classification / Labels / Confidence / Reasoning)</text>

  <!-- Arrows from Agent to Tools -->
  <line x1="200" y1="180" x2="175" y2="218" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="180" x2="400" y2="218" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="180" x2="625" y2="218" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Arrows from Tools to API -->
  <line x1="175" y1="320" x2="200" y2="358" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="320" x2="400" y2="358" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="625" y1="320" x2="600" y2="358" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrowhead)"/>
</svg>
