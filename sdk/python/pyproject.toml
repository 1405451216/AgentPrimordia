[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agentprimordia"
version = "2.0.0"
description = "AgentPrimordia AI Agent Framework - Python SDK"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]

[tool.setuptools.packages.find]
include = ["agentprimordia*"]
