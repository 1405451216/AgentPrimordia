[package]
name = "agentprimordia"
version = "2.0.0"
edition = "2021"
description = "AgentPrimordia Remote HTTP Client for Rust (lightweight REST API client, not a full SDK)"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
thiserror = "2"
